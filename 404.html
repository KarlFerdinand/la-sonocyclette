  @font-face{font-family:'Manrope';font-weight:500;font-display:swap;src:url(/la-sonocyclette/assets/fonts/manrope-latin-500-normal.woff2) format('woff2')}

  :root{--cream:#F6F1E7;--ink:#1E1A2E;--muted:#5E5873;--green:#15B24B;color-scheme:light}

  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--cream);color:var(--ink);font-family:'Manrope','Segoe UI',system-ui,sans-serif;font-weight:700;text-align:center;padding:24px max(18px,env(safe-area-inset-left,0px))}
  img{width:min(260px,70vw);height:auto}
  h1{font-family:'Bricolage Grotesque','Segoe UI',sans-serif;font-weight:700;letter-spacing:-.02em;font-size:clamp(1.8rem,6vw,2.6rem);margin:18px 0 8px}
  p{color:var(--muted);max-width:40ch;margin:0 auto 22px}
  a{display:inline-block;background:var(--green);color:#082a12;border:2px solid #1E1A2E;border-radius:999px;padding:11px 22px;font-weight:800;text-decoration:none;box-shadow:4px 4px 0 #1E1A2E}
